name: backend-ci

on:
  push:
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: pipechina_ci
          POSTGRES_USER: pipechina_ci
          POSTGRES_PASSWORD: pipechina_ci
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipechina_ci -d pipechina_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://pipechina_ci:pipechina_ci@127.0.0.1:5432/pipechina_ci
      TEXT_PROVIDER: fake
      ASR_PROVIDER: fake
      VISION_PROVIDER: fake
      STORAGE_PROVIDER: memory

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.33

      - name: Restore locked environment
        run: |
          uv lock --check
          uv sync --frozen --group dev

      - name: Format and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Type check
        run: uv run mypy app scripts dev

      - name: Compile Python sources
        run: uv run python -m compileall -q app alembic tests scripts dev services

      - name: Run unit and API tests with branch coverage
        run: |
          uv run coverage erase
          uv run coverage run -m pytest -W error
          uv run coverage report

      - name: Apply migrations to PostgreSQL 18
        run: uv run alembic upgrade head

      - name: Verify PostgreSQL schema and Alembic revision
        run: uv run python scripts/verify_postgres_schema.py

      - name: Audit locked environment for known vulnerabilities
        run: uv run pip-audit --local --skip-editable
