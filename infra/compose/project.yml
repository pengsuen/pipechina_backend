name: pipechina

services:
  knowledge-runtime:
    build:
      context: ../..
      dockerfile: services/knowledge_runtime/Dockerfile
    environment:
      API_KEY: ${KNOWLEDGE_SERVICE_API_KEY:?Set KNOWLEDGE_SERVICE_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:?Set pinned embedding model commit}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_REVISION: ${RERANKER_REVISION:?Set pinned reranker model commit}
      MODEL_DEVICE: ${KNOWLEDGE_MODEL_DEVICE:-cpu}
    ports:
      - "127.0.0.1:8103:8000"
    volumes:
      - knowledge_runtime_data:/data
      - knowledge_runtime_models:/home/worker/.cache/huggingface
      - knowledge_runtime_ocr:/usr/local/lib/python3.13/site-packages/rapidocr/models
    networks: [shared-infra]
    mem_limit: 16g
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  asr:
    profiles: [local-models]
    build:
      context: ../../services/asr
    environment:
      ASR_MODEL: ${ASR_MODEL:-large-v3}
      ASR_DEVICE: ${ASR_DEVICE:-cpu}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
      ASR_MODEL_CACHE: /models
    ports:
      - "127.0.0.1:8101:8101"
    volumes:
      - asr_models:/models
    networks: [shared-infra]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8101/health/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  vision:
    profiles: [local-models]
    build:
      context: ../../services/vision
    environment:
      VISION_MODEL: ${VISION_MODEL:-openbmb/MiniCPM-V-4.6}
      HF_HOME: /models
    ports:
      - "127.0.0.1:8102:8102"
    volumes:
      - vision_models:/models
    networks: [shared-infra]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8102/health/live', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  object-storage-init:
    profiles: [s3-local]
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    env_file: [../../.env]
    environment:
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-peter}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-123456}
      S3_USE_SSL: "false"
    command: python -m app.bootstrap.ensure_bucket
    networks: [shared-infra]

networks:
  shared-infra:
    external: true
    name: shared-infra

volumes:
  knowledge_runtime_data:
    name: pipechina_knowledge_runtime_data
  knowledge_runtime_models:
    name: pipechina_knowledge_runtime_models
  knowledge_runtime_ocr:
    name: pipechina_knowledge_runtime_ocr
  asr_models:
    name: pipechina_asr_models
  vision_models:
    name: pipechina_vision_models
